name: Build and test

on:
  push:
    branches: [colorized]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Show compiler errors and warnings as annotations on the run.
      - name: Register compiler problem matcher
        run: echo "::add-matcher::.github/problem-matchers/compiler.json"

      - name: Install build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint gettext texinfo pkg-config
          echo "GMAKE=make" >> "$GITHUB_ENV"

      # maintMakefile's MAKE_CFLAGS has GCC-only warnings that clang rejects
      # under -Werror; keep the rest of the strict set.  clang's
      # -Wstring-compare fires on every streq() with a literal.
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake gettext texinfo pkg-config make
          echo "$(brew --prefix texinfo)/bin" >> "$GITHUB_PATH"
          echo "GMAKE=gmake" >> "$GITHUB_ENV"
          echo "CLANG_CFLAGS=-Wall -Wextra -Werror -Wwrite-strings -Wshadow -Wdeclaration-after-statement -Wbad-function-cast -Wformat-security -Wtype-limits -Wpointer-arith -Wignored-qualifiers -Wno-string-compare" >> "$GITHUB_ENV"

      # savannah.gnu.org is not always reachable from CI; use the GitHub
      # mirror at the revision bootstrap.conf asks for.
      - name: Get gnulib
        run: |
          rev=$(sed -n 's/^GNULIB_REVISION=//p' bootstrap.conf)
          git clone --depth 1 --branch "$rev" https://github.com/coreutils/gnulib.git "$RUNNER_TEMP/gnulib"

      - name: Bootstrap
        run: ./bootstrap --skip-po
        env:
          GNULIB_SRCDIR: ${{ runner.temp }}/gnulib

      # Bootstrap skips the translations, so build without them.
      - name: Configure
        run: ./configure --disable-nls

      - name: Check that output streaming is enabled
        run: grep -E '^#define HAVE_PTHREAD_CREATE 1' src/config.h

      - name: Build (GCC)
        if: runner.os == 'Linux'
        run: $GMAKE -j4

      - name: Build (clang)
        if: runner.os == 'macOS'
        run: $GMAKE -j4 MAKE_CFLAGS="$CLANG_CFLAGS"

      # features/archives expects GNU ar and ranlib; Apple's print other
      # messages and keep member timestamps differently.
      - name: Test suite
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # Tests live in category folders; top-level files like
            # test_template are not tests.
            tests=$(cd tests/scripts && git ls-files | grep / | grep -v '^features/archives$' | tr '\n' ' ')
            $GMAKE check "MAKE_CFLAGS=$CLANG_CFLAGS" MAKETESTFLAGS="$tests"
          else
            $GMAKE check
          fi

      - name: Color and streaming smoke test
        run: sh ./scripts/color-smoke-test.sh ./make

      # Job logs and artifacts need repository access; annotations do not.
      - name: Show failed tests
        if: failure()
        run: |
          [ -d tests/work ] || exit 0
          # GitHub shows 10 error annotations per step: list all failures first.
          list=$(find tests/work -name '*.diff*' | sed 's|^tests/work/||' | sort | tr '\n' ' ')
          echo "::error title=Failed tests::$list"
          find tests/work -name '*.diff*' | sort | while read -r f; do
            body=$(head -c 2000 "$f" | perl -0pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=${f#tests/work/}::$body"
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            tests/work/
            tests/*.log
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # attach the package to a published release
    steps:
      - uses: actions/checkout@v4

      - name: Register compiler problem matcher
        shell: bash
        run: echo "::add-matcher::.github/problem-matchers/compiler.json"

      - name: Bootstrap
        shell: cmd
        run: |
          set "PATH=%PATH%;C:\Program Files\Git\usr\bin"
          call bootstrap.bat

      # bootstrap.bat downloads these from savannah.gnu.org, which does not
      # always answer from CI; use the GitHub mirror at the pinned revision.
      - name: Get gnulib files
        shell: bash
        run: |
          rev=$(sed -n 's/^GNULIB_REVISION=//p' bootstrap.conf | tr -d '\r')
          for f in getloadavg.c intprops.h intprops-internal.h; do
            curl -fsSL -o "lib/$f" "https://raw.githubusercontent.com/coreutils/gnulib/$rev/lib/$f"
          done

      - name: Build
        shell: cmd
        run: call build_w32.bat

      - name: Color and streaming smoke test
        shell: bash
        run: sh ./scripts/color-smoke-test.sh ./WinRel/gnumake.exe

      - name: Package
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ver=${TAG:-$(git rev-parse --short HEAD)}
          name=make-colorized-$ver-windows-x64
          mkdir "$name"
          cp WinRel/gnumake.exe "$name/make.exe"
          perl -pe 's/\r?\n/\r\n/' COPYING > "$name/COPYING.txt"
          perl -pe 's/\r?\n/\r\n/' README.colorized > "$name/README.txt"
          7z a -tzip "$name.zip" "$name" > /dev/null
          echo "PACKAGE=$name.zip" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$name" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE }}

      - name: Attach package to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$PACKAGE" --clobber
